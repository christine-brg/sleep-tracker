services:
  sleeptracker-back:
    image: sleeptracker-back
    container_name: sleeptracker-back
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      sleeptracker-flyway:
        condition: service_completed_successfully
    networks:
      - sleeptracker_network

  sleeptracker_db:
    image: postgres:15.4-alpine
    container_name: sleeptracker_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - sleeptracker_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - sleeptracker_network

  sleeptracker-flyway:
    image: flyway/flyway:latest
    container_name: sleeptracker-flyway
    command: >
      -url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME} 
      -user=${DB_USER} 
      -password=${DB_PASSWORD} 
      -connectRetries=60 
      -locations=filesystem:/flyway/sql 
      repair 
      -outOfOrder=true 
      migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql
    depends_on:
      sleeptracker_db:
        condition: service_healthy
    networks:
      - sleeptracker_network

volumes:
  sleeptracker_db_data:

networks:
  sleeptracker_network:
    name: sleeptracker_network
    external: false
